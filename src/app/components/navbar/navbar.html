<nav class="navbar" aria-label="Navegación principal">
  <a class="navbar__brand" href="#inicio" (click)="closeMenu()">
    <svg class="navbar__brand-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Z" />
      <path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16" />
      <path d="M8 2.5c-1 1 1 2 0 3.5M12 2.5c-1 1 1 2 0 3.5" />
    </svg>
    <span>{{ cafeteria()?.nombre }}</span>
  </a>

  <button
    class="navbar__toggle"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="navbar-links"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="navbar__links" id="navbar-links" [class.navbar__links--open]="menuOpen()">
    @for (seccion of secciones(); track seccion.id) {
      <a [href]="'#' + seccion.clave" (click)="closeMenu()">{{ seccion.menu }}</a>
    }
  </div>
</nav>
